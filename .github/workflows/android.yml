name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch open-source emulator assets
        run: |
          npm install --omit=optional --ignore-scripts --no-audit --no-fund
          node scripts/bundle-core.mjs

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-GBA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish downloadable APK on Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.1.0 app/build/outputs/apk/debug/app-debug.apk \
              --title 'Pocket GBA 0.1.0 (experimental)' \
              --notes 'Android GBA emulator with user-supplied ROM imports. No commercial ROMs included. Experimental debug APK.'
          fi
