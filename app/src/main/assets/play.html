<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#121423">
  <title>Pocket GBA — Playing</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111424;color:white;font-family:system-ui,sans-serif}
    .bar{height:48px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#1c2034;border-bottom:1px solid #333b54}
    .back{border:0;background:#37334f;color:#ddd7ff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700}
    #title{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:#dee1f5}
    #game{width:100%;height:calc(100% - 48px);overflow:hidden}
    #error{display:none;position:absolute;inset:60px 12px auto;padding:12px;background:#4a2b38;color:#fff;border-radius:12px;font-size:13px;z-index:99}
  </style>
</head>
<body>
  <div class="bar"><button class="back" type="button" onclick="PocketAndroid.exitGame()">← Library</button><strong id="title">Game Boy Advance</strong></div>
  <div id="game"></div>
  <div id="error" role="alert"></div>
  <script>
    'use strict';
    const id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[a-z0-9-]+$/.test(id)) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'Invalid game ID.';
    } else {
      const name = PocketAndroid.getGameName(id);
      document.getElementById('title').textContent = name;
      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_gameUrl = '/roms/' + id + '.gba';
      window.EJS_gameName = name;
      window.EJS_pathtodata = '/assets/data/';
      window.EJS_color = '#9b8ff8';
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      const script = document.createElement('script');
      script.src = '/assets/data/loader.js';
      script.onerror = () => {
        const el = document.getElementById('error');
        el.textContent = 'Emulation engine unavailable. Rebuild the APK with the bundled engine.';
        el.style.display = 'block';
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
