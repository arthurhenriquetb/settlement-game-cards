plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arthur.pocketgba'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arthur.pocketgba'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/**']
    }
}
